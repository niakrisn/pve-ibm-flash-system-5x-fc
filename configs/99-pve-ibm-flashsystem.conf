# IBM FlashSystem 5000 Series Multipath Configuration
# Drop-in configuration file for PVE IBM FlashSystem FC plugin
#
# This file provides optimized multipath settings for IBM FlashSystem 2145 devices.
# Placed in /etc/multipath/conf.d/ to avoid modifying user's main multipath.conf
#
# Note: This config only affects devices with vendor "IBM" and product "2145".
# Global defaults (user_friendly_names, find_multipaths) should be configured
# in /etc/multipath.conf by the system administrator.

devices {
    device {
        vendor "IBM"
        product "2145"
        path_grouping_policy "group_by_prio"
        path_selector "service-time 0"
        path_checker "tur"
        features "1 queue_if_no_path"
        hardware_handler "1 alua"
        prio "alua"
        failback "immediate"
        rr_weight "uniform"
        no_path_retry "12"
        dev_loss_tmo "30"
        fast_io_fail_tmo "5"
    }
}
